<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Current homelab architecture</title>
  <desc id="desc">Home devices connect through the private LAN to a Proxmox host and an Ubuntu Docker virtual machine. The virtual machine runs Pi-hole, Uptime Kuma, Nextcloud with MariaDB, Portainer and a Homelab Status App. Tailscale is installed for a remote client path but external validation remains pending. Two local backup sets and a manifest are present; integrity verification, restore testing and encrypted off-site backup remain planned.</desc>
