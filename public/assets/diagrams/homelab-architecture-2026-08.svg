      <rect x="1426" y="54" width="102" height="34" rx="17" fill="#332814" stroke="#fbbf24"/><circle cx="1447" cy="71" r="5" fill="#fbbf24"/><text x="1461" y="77" fill="#fff0b8">Pending</text>
