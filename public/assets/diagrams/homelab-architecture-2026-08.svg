<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Current homelab architecture</title>
  <desc id="desc">A private LAN connects to a Proxmox host and an Ubuntu Docker virtual machine. The virtual machine runs Pi-hole, Uptime Kuma, Nextcloud with MariaDB, Portainer and a Homelab Status App. Tailscale is installed with external validation pending.</desc>
  <rect width="1600" height="900" fill="#07111f"/>
  <text x="80" y="92" fill="#e8f0f7" font-family="Arial, sans-serif" font-size="48" font-weight="700">Current Homelab Architecture</text>
  <text x="80" y="132" fill="#9eb0c1" font-family="Arial, sans-serif" font-size="24">Private infrastructure · reviewed August 2026 · no internal addresses shown</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="210" width="300" height="150" rx="28" fill="#103a3a" stroke="#5eead4" stroke-width="3"/>
    <text x="230" y="275" fill="#e8f0f7" font-size="31" font-weight="700" text-anchor="middle">Private LAN</text>
    <text x="230" y="320" fill="#9eb0c1" font-size="21" text-anchor="middle">DHCP reservation</text>

    <path d="M380 285 H510" stroke="#7db7ff" stroke-width="7"/>
    <path d="M500 268 L530 285 L500 302" fill="none" stroke="#7db7ff" stroke-width="7"/>

    <rect x="530" y="190" width="360" height="190" rx="28" fill="#13263a" stroke="#7db7ff" stroke-width="3"/>
    <text x="710" y="260" fill="#e8f0f7" font-size="32" font-weight="700" text-anchor="middle">Proxmox Host</text>
    <text x="710" y="307" fill="#9eb0c1" font-size="22" text-anchor="middle">Virtualisation layer</text>
    <text x="710" y="342" fill="#5eead4" font-size="19" text-anchor="middle">Host online</text>

    <path d="M890 285 H1015" stroke="#7db7ff" stroke-width="7"/>
    <path d="M1005 268 L1035 285 L1005 302" fill="none" stroke="#7db7ff" stroke-width="7"/>

    <rect x="1035" y="170" width="485" height="230" rx="28" fill="#0c1a2b" stroke="#5eead4" stroke-width="3"/>
    <text x="1278" y="240" fill="#e8f0f7" font-size="32" font-weight="700" text-anchor="middle">Ubuntu Docker VM</text>
    <text x="1278" y="285" fill="#9eb0c1" font-size="22" text-anchor="middle">Container service layer</text>
    <text x="1278" y="328" fill="#5eead4" font-size="20" text-anchor="middle">LVM root expanded: 19 GB → 38 GB</text>
    <text x="1278" y="365" fill="#9eb0c1" font-size="19" text-anchor="middle">Tailscale installed · external validation pending</text>

    <path d="M1278 400 V480" stroke="#7db7ff" stroke-width="7"/>
    <path d="M1261 470 L1278 500 L1295 470" fill="none" stroke="#7db7ff" stroke-width="7"/>

    <g font-size="24" font-weight="700" text-anchor="middle">
      <rect x="80" y="525" width="300" height="125" rx="22" fill="#13263a" stroke="#263b50" stroke-width="3"/>
      <text x="230" y="585" fill="#e8f0f7">Pi-hole</text>
      <text x="230" y="620" fill="#9eb0c1" font-size="18" font-weight="400">DNS filtering</text>

      <rect x="405" y="525" width="300" height="125" rx="22" fill="#13263a" stroke="#263b50" stroke-width="3"/>
      <text x="555" y="585" fill="#e8f0f7">Uptime Kuma</text>
      <text x="555" y="620" fill="#9eb0c1" font-size="18" font-weight="400">Monitoring</text>

      <rect x="730" y="525" width="300" height="125" rx="22" fill="#13263a" stroke="#263b50" stroke-width="3"/>
      <text x="880" y="585" fill="#e8f0f7">Nextcloud</text>
      <text x="880" y="620" fill="#9eb0c1" font-size="18" font-weight="400">MariaDB-backed cloud</text>

      <rect x="1055" y="525" width="220" height="125" rx="22" fill="#13263a" stroke="#263b50" stroke-width="3"/>
      <text x="1165" y="585" fill="#e8f0f7">Portainer</text>
      <text x="1165" y="620" fill="#9eb0c1" font-size="18" font-weight="400">Container UI</text>

      <rect x="1300" y="525" width="220" height="125" rx="22" fill="#13263a" stroke="#263b50" stroke-width="3"/>
      <text x="1410" y="575" fill="#e8f0f7">Homelab</text>
      <text x="1410" y="607" fill="#e8f0f7">Status App</text>
      <text x="1410" y="635" fill="#9eb0c1" font-size="16" font-weight="400">Static labels</text>
    </g>

    <rect x="80" y="725" width="1440" height="95" rx="22" fill="#0c1a2b" stroke="#263b50" stroke-width="3"/>
    <text x="800" y="768" fill="#e8f0f7" font-size="24" font-weight="700" text-anchor="middle">Next resilience improvement</text>
    <text x="800" y="802" fill="#9eb0c1" font-size="20" text-anchor="middle">Automated and off-site backup with documented restore testing — planned, not implemented</text>
  </g>
</svg>
